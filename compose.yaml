services:
  mongodb:
    image: mongo:8
    container_name: lankatransit-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - lankatransit-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: lankatransit-backend:latest
    container_name: lankatransit-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      MONGO_URI: mongodb://mongodb:27017/lankatransit
      PORT: "5000"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - lankatransit-network

  frontend:
    build: ./frontend
    image: lankatransit-frontend:latest
    container_name: lankatransit-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - lankatransit-network

networks:
  lankatransit-network:
    driver: bridge

volumes:
  mongo-data:
    external: true
    name: lankatransit-mongo-data
